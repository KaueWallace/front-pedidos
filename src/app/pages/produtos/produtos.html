<section class="produtos">
    <h1 class="titulo">
        Produtos
    </h1>

    <section class="cards">
        <div class="grid">

            @for (produto of produtos(); track produto.id) {

            <app-produto-card [produto]="produto", (addCarrinho)="adicionarAoCarrinho($event)">
            </app-produto-card>

            }

        </div>
    </section>

</section>
