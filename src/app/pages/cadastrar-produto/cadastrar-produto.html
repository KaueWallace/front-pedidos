<div class="container">

    <div class="card">

        <h1>
            Cadastrar Produto
        </h1>

        <form
            [formGroup]="form"
            (ngSubmit)="salvar()">

            <mat-form-field>

                <mat-label>
                    Nome
                </mat-label>

                <input
                    matInput
                    formControlName="nome">

            </mat-form-field>

            <mat-form-field>

                <mat-label>
                    Preço
                </mat-label>

                <input
                    matInput
                    type="number"
                    formControlName="preco">

            </mat-form-field>

            <mat-form-field>

                <mat-label>
                    Estoque
                </mat-label>

                <input
                    matInput
                    type="number"
                    formControlName="estoque">

            </mat-form-field>

            <mat-form-field>

                <mat-label>
                    URL da Imagem
                </mat-label>

                <input
                    matInput
                    formControlName="imagem">

            </mat-form-field>

            <button
                mat-flat-button
                type="submit">

                Cadastrar Produto

            </button>

        </form>

    </div>

</div>
